# Hand-made adjustments merged by tools/make_config.py into vcs.toml.

# SDK functions the analyzer identified, but whose runtime handler is only a
# TODO that throws. Recompile the game's own copy instead: the tty/Deci2 ones end
# in the Deci2Call syscall, which the runtime implements (and logs the text).
drop_stubs = [
  "sceDmaPause@0x004489F8",
  "sceTtyHandler@0x00468628",
  "sceTtyWrite@0x004687C0",
  "sceTtyRead@0x00468938",
  "sceTtyInit@0x00468A08",
  "sceDeci2Open@0x0046EA98",
  "sceDeci2ReqSend@0x0046EAE8",
  "sceDeci2Poll@0x0046EB18",
  "sceDeci2ExRecv@0x0046EB48",
  "sceDeci2ExSend@0x0046EB80",
]

# _lf_bind spins until the IOP ROM's LOADFILE RPC server (sid 0x80000006)
# answers. Module loading is handled by the runtime's _sceSifLoadModule stub,
# so there is no such server: report success.
stubs = [
  "ret0@0x0046CD10",
  # libfileio directory API -> runtime (served from the mapped disc).
  # FUN_002209F0 walks cdrom0: recursively with these at boot.
  "sceDopen@0x0046C7B8",
  "sceDread@0x0046C9E8",
  "sceDclose@0x0046C880",
  # libcdvd calls that RPC the IOP ROM's cdvdfsv server, which doesn't exist here.
  # (The rest of libcdvd is stubbed from the analyzer's SDK identification.)
  "sceCdSearchFile@0x0044E480",
  "sceCdSearchFile@0x0044E180",  # sceCdLayerSearchFile(fp, name, layer): same args, layer ignored
  "sceCdGetDiskType@0x0044EFA8", # sceCdGetDiskType2
  "sceCdDiskReady@0x0044EB48",   # sceCdDiskReady_old
]

# Instruction patches (address -> replacement word), applied by the recompiler.
#
# FUN_001f1d38 (ped animation movement) turns the frame's animation root displacement into the ped's target velocity
# (+0x794): `if (ms_fTimeStep < 0.5) delta *= 0.5; else delta *= 1 / ms_fTimeStep;` - the `< 0.5` branch is dead on the
# PS2 (CTimer floors the step at 0.5) and wrong (0.5 where 1/step >= 2): below the floor peds ran at a quarter speed,
# which capped frame-rate independent timing at 100 fps. The 0.5 is loaded once for the compare and the multiply
# (`lui $at, 0x3F00` at 0x1F2158); 0.001 instead sends every real step down the 1 / step path, and a zero step still
# gets a finite (near-zero) velocity. Steps >= 0.5 run exactly as before. (game-internals.md 4, docs/PERFORMANCE.md)
[[patches]]
address = "0x001F2158"
value = "0x3C013A83"

# FUN_0031ae38 (CCutsceneObject::ProcessControl, as in reVC) turns the frame's animation movement into a move speed:
# `if (ms_fTimeStep < 0.5) speed *= 2; else speed *= 1 / ms_fTimeStep;`, then adds step * speed to the object's
# offset (+0x210). The `< 0.5` branch is dead on the PS2 and wrong (2 where 1/step > 2): below the floor a cutscene
# character kept only 2 * step of each frame's root movement and drifted off its animation - floating or sunk in the
# ground at 144 fps (mission MAR_A1 "Shakedown"). The 0.5 is only the compare's (`lui $at, 0x3F00` at 0x31B19C);
# 0.001 sends every real step down the 1 / step path, and a zero step still takes the finite `* 2`.
[[patches]]
address = "0x0031B19C"
value = "0x3C013A83"

# FUN_00337208 (CBike::ProcessControl) turns the frame's sideways change of speed into the bike's lean:
# `lean = dv / (max(ms_fTimeStep, 0.5) * 0.008)` (GRAVITY; VC has max(step, 0.01)). Below the floor (above 100 fps) dv
# shrinks with the step but the divisor doesn't, so the bike leant less into turns (22 degrees at 144 fps where it
# leans 30 at 30). The 0.5 is only the max.s operand (`lui $at, 0x3F00` at 0x33BB10, $f1 rewritten at 0x33BB58);
# 0.001 sends every real step through. Steps >= 0.5 run exactly as before. (game-internals.md 4)
[[patches]]
address = "0x0033BB10"
value = "0x3C013A83"

# CVehicle::ProcessWheel (FUN_003E6C18 cars, FUN_003E7618 bikes): with neither gas nor brake the wheel's rolling
# resistance is a brake of 0.9 / mass (0.09 under 500 kg, 0.18 for the RC Bandit, 0.54 / (mass + 200) for bikes; the
# bike version uses 0.18 under 500 kg) - per frame, never multiplied by the time step (reVC: `brake *=
# CTimer::GetTimeStepFix()` under FIX_BUGS). At 144 fps a car coasted down at 16 m/s^2 instead of 3.4, and a bike
# stopped hard enough to pitch onto its nose. Each constant's `lui $at, hi; ori $at, $at, lo; mtc1 $at, $fN` becomes
# `lui $at, 0x8; lwc1 $fN, -0x100 + 4k($at); nop`: the constant is read from guest RAM 0x7FF00 + 4k (below the
# runtime's callback stacks at 0x80000, unused by the game), where game/vcs_physics_timing.cpp writes it scaled by the
# frame's step over the PS2's before every ProcessWheel - the game's own value at 30 fps and below. $at is rewritten
# before any read on every path after each block. Slots: 0x7FF00 0.54, 0x7FF04 0.09, 0x7FF08 0.9, 0x7FF0C 0.18.
[[patches]]
address = "0x003E6EF8"
value = "0x3C010008"
[[patches]]
address = "0x003E6EFC"
value = "0xC421FF00"
[[patches]]
